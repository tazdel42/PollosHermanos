<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Pollos Hermanos - Registro</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/registro.css">
</head>
<body class="registro-body d-flex align-items-center py-4 bg-body-tertiary">

<main class="form-signin w-100 m-auto">
  <div class="card shadow-lg border-0 rounded-4 p-4">
    <form id="registroForm">
      <div class="text-center mb-4">
        <img src="img/logo.png" alt="Logo de Los Pollos Hermanos" class="logo-circle mx-auto mb-3 d-block shadow-sm">
        <h1 class="h3 mb-3 fw-bold text-dark">Nuevo Usuario</h1>
        <p class="text-muted">Crea una cuenta en el sistema</p>
      </div>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingNombre" placeholder="Tu Nombre" required>
        <label for="floatingNombre">Nombre Completo</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
        <label for="floatingEmail">Correo electrónico</label>
      </div>

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" required>
        <label for="floatingPassword">Contraseña</label>
      </div>

      <div class="form-floating mb-3">
        <select class="form-select" id="floatingRol" required>
          <option value="" disabled selected>Selecciona un rol...</option>
          <option value="empleado">Empleado Regular</option>
          <option value="cocinero">Cocinero</option>
          <option value="limpieza">Personal de Limpieza</option>
          <option value="admin">Administrador</option>
        </select>
        <label for="floatingRol">Rol del Usuario</label>
      </div>

      <button class="btn btn-warning w-100 py-2 fw-bold text-danger btn-registro" type="submit">Registrarse</button>
      
      <div class="text-center mt-4">
        <a href="index.html" class="text-decoration-none text-muted small">¿Ya tienes cuenta? Inicia sesión aquí</a>
      </div>
      <p class="mt-5 mb-3 text-body-secondary text-center small">&copy; 2026 Los Pollos Hermanos Inc.</p>
    </form>
  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/registro.js"></script>
</body>
</html>
