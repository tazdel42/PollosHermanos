<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Los Pollos Hermanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/menu.css">
</head>

<body>

    <div class="Barrasuperior d-flex align-items-center justify-content-between px-3">
        <button id="btnToggle" class="btn btn-light me-2">☰</button>
        <h1 class="text-start fs-4 m-0 flex-grow-1">Control de Inventario</h1>
        <span class="user-email" id="userEmail"></span>
    </div>

    <div id="sidebar" class="sidebar">
        <a href="PaginaInicial.html">Inicio</a>
        <a href="menu.html">Menú Diario</a>
        <a href="proveedores.html">Proveedores</a>
        <a href="empleados.html">Empleados</a>
        <a href="inventario.html" style="background-color: #3b3b98; color: white;">Inventario</a>
    </div>

    <div id="contenido" class="contenido-principal">
        <div class="container-fluid mt-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Almacén Central</h2>
                <button id="btnAgregar" class="btn btn-success" data-bs-toggle="modal"
                    data-bs-target="#modalNuevoArticulo">+ Nuevo Artículo</button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header" style="background-color: #371991; color: white;">
                    Existencias
                </div>
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Cantidad</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaInventario">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoArticulo" tabindex="-1" aria-labelledby="modalNuevoArticuloLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #371991; color: white;">
                    <h5 class="modal-title" id="modalNuevoArticuloLabel">Agregar Nuevo Artículo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <form id="formInventario">
                        <div class="mb-3">
                            <label for="nombreArticulo" class="form-label">Nombre del Artículo</label>
                            <input type="text" class="form-control" id="nombreArticulo" placeholder="Ej. Pollo Marinado"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="tipoArticulo" class="form-label">Tipo / Categoría</label>
                            <select class="form-select" id="tipoArticulo" required>
                                <option value="" selected disabled>Selecciona una categoría...</option>
                                <option value="Ingrediente">Ingrediente</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Empaque">Empaque</option>
                                <option value="Limpieza">Limpieza</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="cantidadArticulo" class="form-label">Cantidad Inicial</label>
                            <input type="number" class="form-control" id="cantidadArticulo" placeholder="0" min="0"
                                required>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formInventario" class="btn btn-success">Guardar Artículo</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/sidebar.js"></script>
    <script src="js/inventario.js"></script>
</body>

</html>
