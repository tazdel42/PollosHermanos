<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores | Los Pollos Hermanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/menu.css"> </head>

<body>
    <div class="Barrasuperior d-flex align-items-center justify-content-between px-3">
        <button id="btnToggle" class="btn btn-light me-2">☰</button>
        <h1 class="text-start fs-4 m-0 flex-grow-1">Control de Proveedores</h1>
        <span class="user-email" id="correoUsuarioMenu"></span>
    </div>

    <div id="sidebar" class="sidebar">
        <a href="PaginaInicial.html">Inicio</a>
        <a href="menu.html">Menú Diario</a>
        <a href="proveedores.html" style="background-color: #3b3b98; color: white;">Proveedores</a>
        <a href="empleados.html">Empleados</a>
        <a href="inventario.html">Inventario</a>
        <a href="sucursales.html">Sucursales</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="finanzas.html">Finanzas</a>
        <a href="reportes.html">Reportes</a>
        <a href="asistencias.html">Asistencias</a>
    </div>

    <div id="contenido" class="contenido-principal">
        <div class="container-fluid mt-4">
            <div id="alertaError" class="alert alert-danger d-none"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Directorio de Proveedores</h2>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevoProveedor">+ Nuevo Proveedor</button>
            </div>

            <div class="card shadow-sm">
                <div class="card-header" style="background-color: #371991; color: white;">
                    Proveedores Activos
                </div>
                <div class="card-body">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre del Proveedor</th>
                                <th>Folio/s (Insumos)</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProveedores">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalNuevoProveedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #371991; color: white;">
                    <h5 class="modal-title">Agregar Proveedor</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formProveedor">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Proveedor</label>
                            <input type="text" class="form-control" id="nombreProveedor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Folio/s de Productos</label>
                            <input type="text" class="form-control" id="foliosProveedor" placeholder="Ej. #001, #005" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción de Insumos</label>
                            <textarea class="form-control" id="descProveedor" rows="2" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="agregarProveedor()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarProveedor" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #ffc107; color: #dc3545;">
                    <h5 class="modal-title fw-bold">Editar Proveedor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarProveedor">
                        <input type="hidden" id="editIdProveedor">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Proveedor</label>
                            <input type="text" class="form-control" id="editNombreProveedor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Folio/s de Productos</label>
                            <input type="text" class="form-control" id="editFoliosProveedor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción de Insumos</label>
                            <textarea class="form-control" id="editDescProveedor" rows="2" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarEdicionProveedor()">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/proveedores.js"></script>
</body>

</html>
