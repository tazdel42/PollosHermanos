<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Pollos Hermanos - Iniciar Sesión</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body d-flex align-items-center py-4 bg-body-tertiary">

<main class="form-signin w-100 m-auto">
  <div class="card shadow-lg border-0 rounded-4 p-4">
    <form id="loginForm">
      <div class="text-center mb-4">
        <img src="img/logo.png" alt="Logo de Los Pollos Hermanos" class="logo-circle mx-auto mb-3 d-block shadow-sm">
        <h1 class="h3 mb-3 fw-bold text-dark">Los Pollos Hermanos</h1>
        <p class="text-muted">Sistema de Administración y Monitoreo</p>
      </div>

      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
        <label for="floatingInput">Correo electrónico</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="floatingPassword" placeholder="Contraseña" required>
        <label for="floatingPassword">Contraseña</label>
      </div>

      <div class="form-check text-start my-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="flexCheckDefault">
        <label class="form-check-label" for="flexCheckDefault">
          Recordarme
        </label>
      </div>
      <button class="btn btn-warning w-100 py-2 fw-bold text-danger btn-login" type="submit">Iniciar Sesión</button>
      
      <div class="text-center mt-4">
        <a href="registro.html" class="text-decoration-none text-muted small fw-bold">¿No tienes cuenta? Regístrate aquí</a>
        <br><br>
        <a href="#" class="text-decoration-none text-muted small">¿Olvidaste tu contraseña?</a>
      </div>
      <p class="mt-5 mb-3 text-body-secondary text-center small">&copy; 2026 Los Pollos Hermanos Inc.</p>
    </form>
  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/login.js"></script>
</body>
</html>
