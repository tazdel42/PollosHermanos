<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencias | Los Pollos Hermanos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/empleados.css">

    <!--Librerías para Exportar-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

    <div class="Barrasuperior d-flex align-items-center justify-content-between px-3">
        <button id="btnToggle" class="btn btn-light me-2">☰</button>
        <h1 class="text-start fs-4 m-0 flex-grow-1">Control de Asistencias</h1>
        <span class="user-email">usuario_prueba@correo.com</span>
    </div>

    <div id="sidebar" class="sidebar">
        <a href="PaginaInicial.html">Inicio</a>
        <a href="menu.html">Menú Diario</a>
        <a href="proveedores.html">Proveedores</a>
        <a href="empleados.html">Empleados</a>
        <a href="inventario.html">Inventario</a>
        <a href="sucursales.html">Sucursales</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="finanzas.html">Finanzas</a>
        <a href="reportes.html">Reportes</a>
        <a href="asistencias.html" style="background-color: #3b3b98; color: white;">Asistencias</a>
    </div>

    <div id="contenido" class="contenido-principal">

        <!--Control de Personal (Asistencias)-->
        <div class="card shadow-sm mt-4">
            <div class="card-header" style="background-color: #371991; color: white;">
                Mi Asistencia
            </div>

            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <button class="btn btn-success" onclick="registrarAsistencia()" id="btnRegistrarAsistencia">
                        + Registrar Asistencia
                    </button>
                    <div id="divExportarAsistencias">
                        <button class="btn btn-outline-danger me-2" onclick="exportarAsistenciasPDF()">📄 Exportar
                            PDF</button>
                        <button class="btn btn-outline-success" onclick="exportarAsistenciasExcel()">📊 Exportar
                            Excel</button>
                    </div>
                </div>

                <table class="table table-hover" id="tablaControlHtml">
                    <thead>
                        <tr>
                            <th>Empleado</th>
                            <th>Fecha</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Horas</th>
                            <th>Bono Diario</th>
                            <th>Labor del Día</th>
                            <th>Estado</th>
                            <th id="thAccionesAsistencia">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaControl">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!--Modal Asistencia-->
    <div class="modal fade" id="asistenciaModal" tabindex="-1" aria-labelledby="asistenciaModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header" style="background-color: #371991; color: white;">
                    <h5 class="modal-title" id="asistenciaModalLabel">Registrar Asistencia</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="asistenciaForm">
                        <input type="hidden" id="asistenciaId">
                        <div class="mb-3" id="divAsistenciaEmpleado">
                            <label for="asistenciaEmpleado" class="form-label">Empleado</label>
                            <select class="form-select" id="asistenciaEmpleado" required>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaFecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="asistenciaFecha" required>
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaEntrada" class="form-label">Hora Entrada</label>
                            <input type="time" class="form-control" id="asistenciaEntrada">
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaSalida" class="form-label">Hora Salida</label>
                            <input type="time" class="form-control" id="asistenciaSalida">
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaHoras" class="form-label">Horas Trabajadas</label>
                            <input type="number" class="form-control" id="asistenciaHoras" step="0.5">
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaBono" class="form-label">Bono Diario ($)</label>
                            <input type="number" class="form-control" id="asistenciaBono" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaLabor" class="form-label">Labor del Día</label>
                            <input type="text" class="form-control" id="asistenciaLabor">
                        </div>
                        <div class="mb-3">
                            <label for="asistenciaEstado" class="form-label">Estado de Asistencia</label>
                            <select class="form-select" id="asistenciaEstado">
                                <option value="Presente">Presente</option>
                                <option value="Ausente">Ausente</option>
                                <option value="Retardo">Retardo</option>
                                <option value="Falta Injustificada">Falta Injustificada</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" onclick="guardarAsistencia()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/asistencias.js"></script>

</body>

</html>
